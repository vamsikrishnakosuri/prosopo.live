<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PROSOPO — The Face of AI</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js/+esm",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "talkinghead": "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@1.5/modules/talkinghead.mjs"
    }
  }
  </script>
</head>
<body>
  <div id="stage">
    <div id="avatar"></div>

    <header id="hud-top">
      <div class="logo">PROSOPO<span class="dot">.</span>live</div>
      <div id="status" class="status">
        <span id="status-dot" class="status-dot booting"></span>
        <span id="status-text">Booting…</span>
      </div>
    </header>

    <div id="subtitle" class="subtitle" hidden></div>

    <div id="loader" class="loader" hidden>
      <div class="loader-orbit">
        <span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span>
        <div class="loader-core"></div>
      </div>
      <div class="loader-text" id="loader-text">ESTABLISHING VOICE LINK…</div>
    </div>

    <footer id="hud-bottom">
      <div id="chat-panel" class="chat-panel" hidden>
        <div id="chat-log" class="chat-log"></div>
        <form id="chat-form" class="chat-form" autocomplete="off">
          <input id="chat-input" type="text" placeholder="Message PROSOPO…" maxlength="500" />
          <button type="submit" id="send-btn" class="icon-btn send" title="Send" aria-label="Send">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>
          </button>
        </form>
      </div>

      <div class="dock">
        <button type="button" id="mic-btn" class="dock-btn" title="Voice conversation — talk hands-free" hidden>
          <svg class="dock-icon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
          <span class="dock-label">Voice</span>
        </button>
        <button type="button" id="chat-btn" class="dock-btn" title="Open chat">
          <svg class="dock-icon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span class="dock-label">Chat</span>
        </button>
      </div>

      <div class="hint" id="hint">PRIVATE — NOTHING IS EVER STORED. CONVERSATIONS VANISH WHEN YOU CLOSE THIS TAB.</div>
    </footer>

    <div id="wake" class="wake">
      <div class="wake-title">PROSOPO<span class="dot">.</span>live</div>
      <div class="wake-sub">THE FACE OF AI</div>
      <div class="wake-loader" id="wake-loader">
        <div class="wake-loader-track"><div class="wake-loader-bar" id="wake-loader-bar"></div></div>
        <span id="wake-loader-text">MATERIALIZING FACE…</span>
      </div>
      <div class="wake-buttons">
        <button id="wake-voice" class="wake-btn primary">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
          WAKE — TALK WITH VOICE
        </button>
        <button id="wake-text" class="wake-btn">TEXT ONLY</button>
      </div>
      <div class="wake-note">Voice mode listens hands-free. Private — nothing is ever stored.</div>
    </div>
  </div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
