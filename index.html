<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PROSOPO — The Face of AI</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js/+esm",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "talkinghead": "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@1.5/modules/talkinghead.mjs"
    }
  }
  </script>
</head>
<body>
  <div id="stage">
    <div id="avatar"></div>

    <header id="hud-top">
      <div class="logo">PROSOPO<span class="dot">.</span>live</div>
      <div id="status" class="status">
        <span id="status-dot" class="status-dot booting"></span>
        <span id="status-text">Booting…</span>
      </div>
    </header>

    <div id="subtitle" class="subtitle" hidden></div>

    <footer id="hud-bottom">
      <div id="chat-panel" class="chat-panel" hidden>
        <div id="chat-log" class="chat-log"></div>
        <form id="chat-form" class="chat-form" autocomplete="off">
          <input id="chat-input" type="text" placeholder="Message PROSOPO…" maxlength="500" />
          <button type="submit" id="send-btn" class="icon-btn send" title="Send">➤</button>
        </form>
      </div>

      <div class="dock">
        <button type="button" id="mic-btn" class="dock-btn" title="Voice conversation — talk hands-free" hidden>
          <span class="dock-icon">🎙</span><span class="dock-label">Voice</span>
        </button>
        <button type="button" id="chat-btn" class="dock-btn" title="Open chat">
          <span class="dock-icon">💬</span><span class="dock-label">Chat</span>
        </button>
      </div>

      <div class="hint" id="hint">🔒 Private — conversations live only in this tab and vanish forever when you close it.</div>
    </footer>
  </div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
