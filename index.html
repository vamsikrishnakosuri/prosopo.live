<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PROSOPO — The Face of AI</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js/+esm",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "talkinghead": "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@1.5/modules/talkinghead.mjs"
    }
  }
  </script>
</head>
<body>
  <div id="stage">
    <div id="avatar"></div>

    <header id="hud-top">
      <div class="logo">PROSOPO<span class="dot">.</span>live</div>
      <div class="hud-right">
        <div class="lang-switch" title="Language — the mic listens in the selected language">
          <button type="button" id="lang-en" class="lang-opt active">EN</button>
          <button type="button" id="lang-te" class="lang-opt">తెలుగు</button>
        </div>
        <div id="status" class="status">
          <span id="status-dot" class="status-dot booting"></span>
          <span id="status-text">Booting…</span>
        </div>
      </div>
    </header>

    <div id="subtitle" class="subtitle" hidden></div>

    <div id="loader" class="loader" hidden>
      <div class="loader-scene">
        <span class="star s1"></span><span class="star s2"></span><span class="star s3"></span>
        <span class="star s4"></span><span class="star s5"></span><span class="star s6"></span>

        <svg class="planet-prosopo" viewBox="0 0 140 90">
          <defs>
            <pattern id="pdots" width="5.5" height="5.5" patternUnits="userSpaceOnUse">
              <circle cx="2.7" cy="2.7" r="1.5" fill="#cfeaff"/>
            </pattern>
          </defs>
          <ellipse cx="70" cy="45" rx="62" ry="13" fill="none" stroke="rgba(0,229,255,0.45)" stroke-width="1.4"/>
          <circle cx="70" cy="45" r="33" fill="#04121e"/>
          <circle cx="70" cy="45" r="33" fill="url(#pdots)" opacity="0.95"/>
          <circle cx="70" cy="45" r="33" fill="none" stroke="#7fd8ff" stroke-width="1.3"/>
          <rect x="34" y="37" width="72" height="16" rx="8" fill="rgba(2,8,16,0.82)"/>
          <text x="70" y="48.5" text-anchor="middle" font-size="9.5" letter-spacing="2.5" font-family="Consolas, monospace" font-weight="bold" fill="#e8f7ff">PROSOPO</text>
        </svg>

        <svg class="rocket" viewBox="0 0 60 100" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M30 6 C40 20 42 38 42 52 L42 66 L18 66 L18 52 C18 38 20 20 30 6 Z"/>
          <circle cx="30" cy="38" r="9"/>
          <text id="rocket-pct" x="30" y="41" text-anchor="middle" font-size="8" font-family="Consolas, monospace" fill="currentColor" stroke="none">0</text>
          <path d="M18 54 L6 70 L18 66"/>
          <path d="M42 54 L54 70 L42 66"/>
          <path class="flame f1" d="M24 68 C25 80 28 86 30 92 C32 86 35 80 36 68"/>
          <path class="flame f2" d="M27 68 C28 76 29 80 30 84 C31 80 32 76 33 68"/>
        </svg>

        <img class="planet-earth" src="/assets/earth.png" alt="" />
      </div>
      <div class="loader-text" id="loader-text">ESTABLISHING VOICE LINK…</div>
    </div>

    <footer id="hud-bottom">
      <div id="chat-panel" class="chat-panel" hidden>
        <div id="chat-log" class="chat-log"></div>
        <form id="chat-form" class="chat-form" autocomplete="off">
          <input id="chat-input" type="text" placeholder="Message PROSOPO…" maxlength="500" />
          <button type="submit" id="send-btn" class="icon-btn send" title="Send" aria-label="Send">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>
          </button>
        </form>
        <button type="button" id="forget-btn" class="forget-btn">Forget everything you know about me</button>
      </div>

      <div class="dock">
        <button type="button" id="mic-btn" class="dock-btn" title="Voice conversation — talk hands-free" hidden>
          <svg class="dock-icon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
          <span class="dock-label">Voice</span>
        </button>
        <button type="button" id="chat-btn" class="dock-btn" title="Open chat">
          <svg class="dock-icon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span class="dock-label">Chat</span>
        </button>
      </div>

      <div class="hint" id="hint">PRIVATE — CHATS ARE NEVER STORED. MEMORY LIVES ONLY IN YOUR OWN BROWSER.</div>
    </footer>

    <div id="wake" class="wake">
      <div class="wake-title">PROSOPO<span class="dot">.</span>live</div>
      <div class="wake-sub">THE FACE OF AI</div>
      <div class="wake-loader" id="wake-loader">
        <div class="wake-loader-track"><div class="wake-loader-bar" id="wake-loader-bar"></div></div>
        <span id="wake-loader-text">MATERIALIZING FACE…</span>
      </div>
      <div class="wake-buttons">
        <button id="wake-voice" class="wake-btn primary">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
          WAKE — TALK WITH VOICE
        </button>
        <button id="wake-text" class="wake-btn">TEXT ONLY</button>
      </div>
      <div class="wake-note">Voice mode listens hands-free. Private — nothing is ever stored.</div>
    </div>
  </div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
